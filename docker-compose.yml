version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/focusverify.db}
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me-for-local-use}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REVIEWER_EMAIL: ${REVIEWER_EMAIL:-reviewer@focusverify.local}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-focusverify-demo}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - focusverify_data:/app/data
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  focusverify_data:
